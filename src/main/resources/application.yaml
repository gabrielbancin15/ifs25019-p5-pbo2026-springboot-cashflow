server:
  port: ${APP_PORT:8080}
spring:
  application:
    name: cashflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbo2026_cashflow}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
vaadin:
  launch-browser: false
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin123}
